<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="{{root}}assets/fonts/D-DINCondensed-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="{{root}}assets/theme.js"></script>
</head>
<body class="{{page_class}}">
<a class="skip" href="#main">Skip to content</a>
<header class="desk-head">
  <div class="desk-head-inner">
    <a class="brand" href="{{root}}index.html" aria-label="forge, home"><span class="brand-plate">forge</span><span class="describer">v{{version}}</span></a>
    <nav class="bank nav-bank" aria-label="Site">
      <a href="{{root}}index.html"{{nav_home}}><span class="lamp"></span>Home</a>
      <a href="{{root}}docs/index.html"{{nav_docs}}><span class="lamp"></span>Docs</a>
      <a href="{{github}}/blob/main/CHANGELOG.md"><span class="lamp"></span>Changelog</a>
      <a href="{{github}}"><span class="lamp"></span>GitHub</a>
    </nav>
    <div class="bank icon-bank" role="group" aria-label="Colour theme">
      <button type="button" data-theme-choice="system" aria-pressed="true" title="Follow the system"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="sr">Follow the system</span></button>
      <button type="button" data-theme-choice="light" aria-pressed="false" title="Light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="sr">Light</span></button>
      <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span class="sr">Dark</span></button>
    </div>
  </div>
</header>
<main id="main">
{{content}}
</main>
<footer class="desk-foot">
  <div class="desk-foot-inner">
    <p><span class="brand-plate small">forge</span> Open source, MIT License. Built with forge.</p>
    <ul>
      <li><a href="{{github}}">Source</a></li>
      <li><a href="https://www.npmjs.com/package/@giamme/forge">npm</a></li>
      <li><a href="{{github}}/issues">Issues</a></li>
      <li><a href="{{github}}/blob/main/CHANGELOG.md">Changelog</a></li>
      <li><a href="{{root}}docs/index.html">Docs</a></li>
    </ul>
  </div>
</footer>
<script src="{{root}}assets/site.js"></script>
</body>
</html>
