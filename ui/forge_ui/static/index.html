<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>forge-ui</title>
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="D-DINCondensed-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="icons.js" defer></script>
  <script src="uikit.js" defer></script>
  <script src="datatable.js" defer></script>
  <script src="runmodel.js" defer></script>
  <script src="cloudmodel.js" defer></script>
  <script src="modelstats.js" defer></script>
  <script src="graph.js" defer></script>
  <script src="gantt.js" defer></script>
  <script src="controls.js" defer></script>
  <script src="panel.js" defer></script>
  <script src="diffview.js" defer></script>
  <script src="convo.js" defer></script>
  <script src="files.js" defer></script>
  <script src="map3d.js" defer></script>
  <script src="cloudui.js" defer></script>
  <script src="leaderboard.js" defer></script>
  <script src="search.js" defer></script>
  <script src="notify.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-shell="immersive" data-runs="open" data-insp="open" data-tasks="open">
  <script src="shell.js"></script>
  <header class="topbar">
    <a class="brand" href="#/" title="forge-ui · local run viewer"><span class="brand-plate">forge</span><span class="brand-sub">ui</span></a>
    <nav class="desk-nav" aria-label="Views">
      <a class="top-link" href="#/">Map</a>
      <a class="top-link" href="#/cloud">Cloud</a>
      <a class="top-link" href="#/models">Models</a>
    </nav>
    <button class="top-search" type="button" data-jump title="Jump to a run, task, project, model or command (/)"><span class="top-search-label"><span>Search</span></span> <kbd>Ctrl K</kbd></button>
    <div class="desk-tools">
      <button id="bell" class="bell" type="button" aria-label="Notifications"><span class="bell-count" hidden></span></button>
      <label class="refresh-control" title="Poll the runs for changes"><input id="refresh" type="checkbox" checked> Live</label>
    </div>
  </header>
  <div id="errors" role="status" aria-live="polite" hidden></div>
  <div class="layout">
    <aside class="sidebar module" aria-label="Runs" data-overlay>
      <div class="module-head"><h1 class="module-title">Runs</h1><span id="run-count" class="module-count"></span><span class="module-tools"></span></div>
      <div class="runs-tools">
        <label class="visually-hidden" for="filter">Filter by goal, repo, ID, path or model</label>
        <input id="filter" type="search" placeholder="Filter runs…" autocomplete="off">
        <select id="run-sort" aria-label="Sort the runs"><option value="updated">Latest</option><option value="state">State</option><option value="repo">Repo</option></select>
      </div>
      <nav id="run-list" aria-label="Choose a run"><p class="empty">Loading runs…</p></nav>
    </aside>
    <main id="main" tabindex="-1"><p class="empty">Loading…</p></main>
  </div>
  <div id="live" class="visually-hidden" aria-live="polite"></div>
</body>
</html>
