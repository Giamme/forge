<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>forge-ui</title>
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="runmodel.js" defer></script>
  <script src="cloudmodel.js" defer></script>
  <script src="graph.js" defer></script>
  <script src="gantt.js" defer></script>
  <script src="panel.js" defer></script>
  <script src="diffview.js" defer></script>
  <script src="map3d.js" defer></script>
  <script src="cloudui.js" defer></script>
  <script src="search.js" defer></script>
  <script src="notify.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">forge-ui</a>
    <a class="top-link" href="#/">Map of all runs</a>
    <a class="top-link" href="#/cloud">Run cloud</a>
    <span class="muted">Local run viewer · read only</span>
    <button class="top-search" type="button" data-jump title="Jump to a run, task, project, model or command (/)">Search <kbd>Ctrl K</kbd></button>
    <button id="bell" class="bell" type="button" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0-6 6v3.6L4.3 15.4A1 1 0 0 0 5.2 17h13.6a1 1 0 0 0 .9-1.6L18 12.6V9a6 6 0 0 0-6-6Zm-2.6 15.5a2.7 2.7 0 0 0 5.2 0Z"/></svg><span class="bell-count" hidden></span></button>
    <label class="refresh-control"><input id="refresh" type="checkbox" checked> Live refresh</label>
  </header>
  <div id="errors" role="status" aria-live="polite" hidden></div>
  <div class="layout">
    <aside class="sidebar" aria-label="Runs">
      <div class="sidebar-heading"><h1>Runs</h1><span id="run-count" class="muted"></span></div>
      <label class="filter-label" for="filter">Filter by goal, repo, ID, path or model</label>
      <input id="filter" type="search" placeholder="Filter runs…" autocomplete="off">
      <nav id="run-list" aria-label="Choose a run"><p class="empty">Loading runs…</p></nav>
    </aside>
    <main id="main" tabindex="-1"><p class="empty">Loading…</p></main>
  </div>
  <div id="live" class="visually-hidden" aria-live="polite"></div>
</body>
</html>
