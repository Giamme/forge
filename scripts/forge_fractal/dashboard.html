<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge · Fractal execution</title><style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#10151c;color:#e5edf5}*{box-sizing:border-box}body{margin:0}main,header{max-width:1100px;margin:auto;padding:24px}header{border-bottom:1px solid #455369}h1{font-size:28px;margin:0}h2{font-size:21px}h3{font-size:17px}.muted{color:#acbfd0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card,details{padding:16px;border:1px solid #455369;border-radius:10px;background:#19222d;margin:12px 0}details details{margin-left:12px}summary{cursor:pointer;font-weight:600;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:480px;overflow:auto;font-size:13px}button,a{color:#a5d9ff}button{background:#26374a;border:1px solid #637a91;border-radius:6px;padding:8px 12px;cursor:pointer;margin:4px}a{overflow-wrap:anywhere}:focus-visible{outline:3px solid #ffd877;outline-offset:4px}.status{font-weight:700;color:#b5e4ff}code{overflow-wrap:anywhere}#error{color:#ffbec3}nav{display:flex;flex-wrap:wrap;gap:12px}@media(max-width:500px){main,header{padding:16px}details{padding:10px}details details{margin-left:4px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><header><h1>Forge / Fractal</h1><p class="muted">Execution observability · Forge acceptance is tracked separately</p><nav><a href="?">All runs</a><button id="logs">Load logs &amp; candidate changes</button><button id="prev">Previous history</button><button id="next">Next history</button></nav><p id="connection" role="status"></p></header>
<main><p id="error" role="alert"></p><div id="content"></div></main>
<script id="capture" type="application/json">__CAPTURE__</script><script>
'use strict';
const live=__LIVE__;let data=JSON.parse(document.getElementById('capture').textContent),offset=0,logs=false,lastRender="";
const content=document.getElementById('content'),error=document.getElementById('error');
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function box(title,value,key){const d=el('details');d.dataset.key=key;d.append(el('summary',title),el('pre',typeof value==='string'?value:JSON.stringify(value,null,2)));return d}
function draw(){const comparable=JSON.stringify({...data,captured_at:undefined});if(comparable===lastRender)return;lastRender=comparable;const opened=new Set([...document.querySelectorAll('details[open]')].map(n=>n.dataset.key));const focus=document.activeElement.closest('details')?.dataset.key;content.replaceChildren();
 if(data.error){error.textContent=data.error;return}error.textContent='';
 if(data.runs){content.append(el('h2','Managed runs'));if(!data.runs.length)content.append(el('p','No managed runs yet. Start a Forge run with --fractal.','muted'));for(const r of data.runs){const a=el('a',r.id+' · '+r.repository);a.href='?run='+encodeURIComponent(r.id);const card=el('div',undefined,'card');card.append(a);content.append(card)}if(data.diagnostics?.length)content.append(box('Discovery diagnostics',data.diagnostics,'diagnostics'));}
 else{const c=data.config;const knownCosts=data.tasks.flatMap(t=>t.nodes).filter(n=>typeof n.cost==='number'&&Number.isFinite(n.cost));const costLabel=knownCosts.length?'Observed cost: '+knownCosts.reduce((sum,n)=>sum+n.cost,0).toFixed(4)+' USD · see nodes for unknown usage':'Cost: unknown · observational only';content.append(el('h2',c.id),el('p',c.repository,'muted'));const cards=el('div',undefined,'grid');cards.append(el('div','Backend: Fractal '+c.version,'card'),el('div',costLabel,'card'),el('div','History offset: '+offset,'card'));content.append(cards,box('Effective configuration',c,'config'));
 const controls=el('div',undefined,'card');controls.append(el('h3','Run controls (CLI only)'));for(const verb of ['pause','resume','stop'])controls.append(el('pre','forge fractal '+verb+' '+c.id));content.append(controls);
 if(!data.tasks.length)content.append(el('p','No task execution has started.','muted'));
 for(const t of data.tasks){const section=el('section');section.append(el('h2',t.id));const status=el('div',undefined,'grid');status.append(el('p','Fractal execution: '+t.state.status,'status'),el('p','Forge acceptance: '+t.acceptance,'status'),el('p','Verification: '+t.verification+' · QA execution: '+(t.state.qa_status||'unknown')),el('p','Elapsed: '+Math.round(t.state.elapsed||0)+'s'));section.append(status);
 function node(n){const d=el('details');d.dataset.key=t.id+':'+n.id;d.append(el('summary',n.id+' · '+n.status+' · '+n.model+' · iteration '+n.iteration));d.append(el('p','Difficulty: '+n.difficulty+' · Owned paths: '+n.paths.join(', ')),el('p','Observed cost: '+(n.cost==null?'unknown':n.cost+' USD')+' · Unpriced steps: '+(n.unknown_cost_steps??'unknown')+' · Last step tokens: '+JSON.stringify(n.tokens??'unknown')),box('Goal and preserved response',{goal:n.goal,last:n.last,error:n.error},d.dataset.key+':goal'));if(n.decomposition)d.append(box('Decomposition decision',{phase:n.phase,planner:n.resolved_planner,decision:n.decomposition,history:n.decomposition_history,tokens:n.planning_tokens,last:n.planning_last},d.dataset.key+':decision'));if(n.logs)d.append(box('Raw logs',n.logs,d.dataset.key+':logs'));if(n.candidate_changes)d.append(box('Candidate changes',n.candidate_changes,d.dataset.key+':diff'));for(const child of t.nodes.filter(x=>x.parent===n.id))d.append(node(child));return d}
 for(const n of t.nodes.filter(n=>!n.parent||!t.nodes.some(p=>p.id===n.parent)))section.append(node(n));for(const key of ['activity','coordinator_events','steps','messages','qa','coordinator_log'])if(t[key])section.append(box(key,t[key],t.id+key));content.append(section)}
 }
 for(const d of document.querySelectorAll('details')){if(opened.has(d.dataset.key))d.open=true;if(focus===d.dataset.key)d.querySelector('summary').focus()}
 document.getElementById('connection').textContent=live?'Live · refreshes every 2 seconds':'Offline capture · '+new Date((data.captured_at||0)*1000).toLocaleString();}
async function refresh(){if(!live)return;try{const q=new URLSearchParams(location.search);q.set('offset',offset);if(logs)q.set('logs','1');const response=await fetch('data?'+q);if(!response.ok)throw Error('Dashboard access failed: '+response.status);data=await response.json();draw()}catch(e){error.textContent=e.message}}
document.getElementById('logs').onclick=()=>{logs=true;refresh()};document.getElementById('next').onclick=()=>{offset+=100;refresh()};document.getElementById('prev').onclick=()=>{offset=Math.max(0,offset-100);refresh()};if(!live){for(const id of ['logs','next','prev'])document.getElementById(id).hidden=true;document.querySelector('nav a').hidden=true}draw();if(live)setInterval(refresh,2000);
</script></body></html>
