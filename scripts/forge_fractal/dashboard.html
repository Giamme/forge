<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Forge · Run inspector</title>
<style>/*__STYLE__*/</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">F</span><span>Forge <span class="brand-muted">/ run inspector</span></span></div>
    <div class="top-actions">
      <span id="connection" class="connection" role="status" aria-live="polite"></span>
      <button id="retry" type="button" hidden>Retry</button>
      <button id="pause-updates" type="button" aria-pressed="false" hidden>Pause live updates</button>
    </div>
  </header>
  <div class="runbar">
    <div class="run-title"><a id="all-runs" href="?run=">All runs</a><span class="slash">/</span><h1 id="run-heading">Runs</h1></div>
    <div id="run-meta" class="run-meta"></div>
  </div>
  <div class="workspace">
    <aside id="navigator" class="navigator" aria-label="Run navigation">
      <div class="nav-heading"><h2>Navigate</h2><span id="nav-count"></span></div>
      <label class="search-label" for="search">Search tasks and nodes</label>
      <input id="search" type="search" placeholder="Goal, name, model, status…" autocomplete="off">
      <div id="tree" class="tree"></div>
    </aside>
    <main id="detail" class="detail" tabindex="-1">
      <div class="detail-header"><button id="mobile-back" type="button">Back to navigator</button><div><p id="eyebrow" class="eyebrow"></p><h2 id="detail-title"></h2><p id="detail-subtitle" class="muted"></p></div></div>
      <nav id="tabs" class="tabs" aria-label="Detail views"></nav>
      <div id="detail-body" class="detail-body"></div>
    </main>
  </div>
</div>
<script id="capture" type="application/json">__CAPTURE__</script>
<script>const FORGE_LIVE = __LIVE__; /*__SCRIPT__*/</script>
</body>
</html>
