# Builds forge's website (site/) and publishes it with GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "registry.tsv"
      - "VERSION"
      - "ui/forge_ui/static/D-DINCondensed-Bold.woff2"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "registry.tsv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only; fails on a broken internal link.
      - name: Build the site
        run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
