# Publishes @giamme/forge to npm.
# - A dev -> main release merge that changes VERSION: tags v<VERSION>, creates the GitHub Release
#   with the notes from CHANGELOG.md, then publishes. Nothing happens when that tag already exists.
# - A GitHub Release published by hand: publishes its tag.
# No token: npm trusted publishing (OIDC). One-time setup on npmjs.com, package @giamme/forge →
# Settings → Trusted publishing → GitHub Actions: owner Giamme, repository forge, workflow
# npm-publish.yml. Provenance is attached automatically.
# Re-run for a tag by hand: Actions → npm publish → Run workflow (tag, e.g. v0.19).
name: npm publish

on:
  push:
    branches: [main]
    paths: [VERSION]          # only release merges bump it, so other pushes start nothing
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.19)"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  # A Release made here with GITHUB_TOKEN doesn't trigger `release: published`, so the publish
  # job below runs after it in this same workflow (which also keeps npm trusted publishing valid).
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.make.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag and create the GitHub Release unless it exists
        id: make
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(tr -d '[:space:]' < VERSION)"
          tag="v$ver"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release"; exit 0
          fi
          # The CHANGELOG.md section for this version, without its heading.
          awk -v h="## [$ver]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    # On a push, only after the release job made a new tag; otherwise (release, dispatch) always.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.release.outputs.tag != '') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1 && npm --version
      - name: The tag, VERSION and package.json agree
        run: |
          ver="$(tr -d '[:space:]' < VERSION)"
          pkg="$(node -p "require('./package.json').version")"
          [ "$TAG" = "v$ver" ] || { echo "tag $TAG is not v$ver (VERSION)"; exit 1; }
          case "$pkg" in "$ver"|"$ver".0) ;; *) echo "package.json $pkg does not match VERSION $ver"; exit 1 ;; esac
          echo "PKG_VERSION=$pkg" >> "$GITHUB_ENV"
      - name: Skip a version npm already has
        id: seen
        run: |
          if npm view "@giamme/forge@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@giamme/forge@$PKG_VERSION is already on npm"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.seen.outputs.skip != '1'
        run: npm publish
