# Runs the offline test suite (tests/check.sh). No secrets and read-only permissions, so it is
# safe on pull requests from forks. The suite never calls a real model: it runs against fake
# agent CLIs (see tests/README.md).
#
# Pull requests run Linux with Python 3.9, the oldest Python forge supports, and one Windows job
# (Git Bash, latest Python 3.x): see the windows job below. Pushes to dev, and runs started by
# hand (Actions → Tests → Run workflow, on any branch), also run Linux with the latest 3.x and
# macOS (with the system Bash 3.2) with both: macOS runners are slow and GitHub runs few of them
# at once. A pull request that only changes documentation (DOCS_ONLY below) runs no tests at all.
# Pull requests are merged into dev, and main only receives releases from dev, so a push to main
# runs nothing more: its commits already passed on dev.
#
# The whole suite takes about 40 minutes on one runner, so each OS and Python pair splits it into
# 4 shards (tests/run_tests.py --shard). The "Tests passed" job at the end is the one check to
# require for merging: it fails when any shard did, and passes for a documentation-only change.
# The msys2 job (Windows MSYS2 mode, a short list of tests) runs with the windows job but is not
# part of "Tests passed" yet: it becomes required once it has been reliable for a while.

name: Tests

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Pick the jobs
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.pick.outputs.run }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # A pull request is checked out as its merge into the base branch: with the merge's parents
      # fetched, HEAD^1..HEAD is exactly what the pull request changes.
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        # setup-python has no 3.9 build for Ubuntu 26.04 (ubuntu-latest), so Linux 3.9 runs on 24.04.
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import fnmatch, json, os, subprocess, sys
          # Files no test reads. SKILL.md, references/ and site/ are not here: the suite checks them.
          DOCS_ONLY = ['docs/*', '.changelog/*', 'README.md', 'CONTRIBUTING.md', 'SECURITY.md',
                       'CHANGELOG.md', 'LICENSE', 'tests/README.md', '.github/ISSUE_TEMPLATE/*',
                       '.github/PULL_REQUEST_TEMPLATE.md']
          run = True
          if os.environ['EVENT'] == 'pull_request':
              changed = subprocess.run(['git', 'diff', '--name-only', '-z', 'HEAD^1', 'HEAD'], check=True,
                                       capture_output=True, text=True).stdout.split('\0')
              changed = [path for path in changed if path]
              print('changed files:', *changed, sep='\n  ', file=sys.stderr)
              run = not all(any(fnmatch.fnmatchcase(path, glob) for glob in DOCS_ONLY) for path in changed)
              pairs = [('ubuntu-24.04', '3.9')]
          else:
              pairs = [('ubuntu-24.04', '3.9'), ('ubuntu-latest', '3.x'),
                       ('macos-latest', '3.9'), ('macos-latest', '3.x')]
          include = [{'os': o, 'python': p, 'shard': s} for o, p in pairs for s in (1, 2, 3, 4)]
          print('run=' + ('true' if run else 'false'))
          print('matrix=' + json.dumps({'include': include}))
          PY

  check:
    name: ${{ matrix.os }} · Python ${{ matrix.python }} · ${{ matrix.shard }}/4
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # macOS users run forge under the system Bash 3.2, but the runner image puts Homebrew's
      # Bash 5 first on PATH. Put /bin/bash first so the tests (which look bash up on PATH)
      # exercise the Bash forge has to support.
      - name: Use the system Bash 3.2 on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -s /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          bash --version | head -1
          python3 --version
          git --version
          command -v node >/dev/null && node --version || true
      - name: tests/check.sh --shard ${{ matrix.shard }}/4
        run: bash tests/check.sh --shard ${{ matrix.shard }}/4

  # Native Windows (Git Bash with a Windows Python), one job with the latest Python, on every pull
  # request (to dev or main), every push to dev and runs started by hand. forge does not run
  # natively on Windows yet (the port's part 2 adds the entry points), so the tests that need what
  # is missing are listed in tests/windows-pending.txt, with why, and run_tests.py leaves them
  # out here. What runs covers the platform adapters and everything that already works.
  windows:
    name: windows-latest · Python 3.x
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Versions
        run: |
          bash --version | head -1
          python3 --version
          git --version
      - name: tests/check.sh
        run: bash tests/check.sh

  # Windows MSYS2 mode (scripts/forge-win.sh), in the runner's own MSYS2: only the tests that cover
  # what the mode changes. Not in the passed job's needs yet: it becomes required once it has been
  # reliable for a while.
  msys2:
    name: windows-latest · MSYS2
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      MSYS: winsymlinks:native
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          release: false
          update: true
          install: python git procps-ng diffutils
      - name: Versions
        run: |
          bash --version | head -1
          python3 --version
          git --version
      - name: tests/run_tests.py (MSYS2 mode)
        run: >-
          python3 tests/run_tests.py forge:test_forge_win. forge:test_flock. forge:test_guards.
          forge:test_cross_platform. forge:test_pr. ui:test_reader.

  passed:
    name: Tests passed
    if: always()
    needs: [plan, check, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          PLAN: ${{ needs.plan.result }}
          RUN: ${{ needs.plan.outputs.run }}
          CHECK: ${{ needs.check.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "plan: $PLAN, tests needed: $RUN, shards: $CHECK, windows: $WINDOWS"
          [ "$PLAN" = success ] || exit 1
          if [ "$RUN" = false ]; then echo "documentation only: no tests to run"; exit 0; fi
          [ "$CHECK" = success ] || exit 1
          [ "$WINDOWS" = success ]
